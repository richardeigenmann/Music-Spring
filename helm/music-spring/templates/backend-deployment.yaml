apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-backend
  labels:
    app: music-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: music-backend
  template:
    metadata:
      labels:
        app: music-backend
    spec:
      containers:
        - name: music-backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.backend.env.springDatasourceUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.backend.env.springDatasourceUsername | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.backend.env.springDatasourcePassword | quote }}
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: {{ .Values.backend.env.springJpaHibernateDdlAuto | quote }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              value: {{ .Values.backend.env.springJpaPropertiesHibernateDefaultSchema | quote }}
            - name: APP_CORS_ALLOWED_ORIGINS
              value: {{ .Values.backend.env.appCorsAllowedOrigins | quote }}
            - name: SPRING_CONFIG_IMPORT_EXTRA
              value: {{ .Values.backend.env.springConfigImportExtra | quote }}
          volumeMounts:
            {{- if .Values.backend.persistence.mp3.enabled }}
            - name: mp3-volume
              mountPath: {{ .Values.backend.persistence.mp3.mountPath }}
            {{- end }}
            {{- if .Values.backend.persistence.config.enabled }}
            - name: config-volume
              mountPath: {{ .Values.backend.persistence.config.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.backend.persistence.mp3.enabled }}
        - name: mp3-volume
          {{- if eq .Values.backend.persistence.mp3.type "hostPath" }}
          hostPath:
            path: {{ .Values.backend.persistence.mp3.hostPath }}
          {{- else if eq .Values.backend.persistence.mp3.type "nfs" }}
          nfs:
            server: {{ .Values.backend.persistence.mp3.server }}
            path: {{ .Values.backend.persistence.mp3.path }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.backend.persistence.config.enabled }}
        - name: config-volume
          {{- if eq .Values.backend.persistence.config.type "hostPath" }}
          hostPath:
            path: {{ .Values.backend.persistence.config.hostPath }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
